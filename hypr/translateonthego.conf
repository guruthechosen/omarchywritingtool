# TranslateOnTheGo — Hyprland integration
# Sourced by ~/.config/hypr/hyprland.conf

# Keybind: Super + H → trigger writing tools on PRIMARY selection
bindd = SUPER, H, TranslateOnTheGo, exec, uwsm-app -- translateonthego

# Review window: float, center, sized
windowrule = float on, match:class ^(com\.translateonthego\.review)$
windowrule = center on, match:class ^(com\.translateonthego\.review)$
windowrule = size 740 560, match:class ^(com\.translateonthego\.review)$
